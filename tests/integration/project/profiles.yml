opteryx_integration:
  target: cloud
  outputs:
    cloud:
      type: opteryx
      host: opteryx.app
      port: 443
      ssl: true
      user: "{{ env_var('CLIENT_ID') }}"
      token: "{{ env_var('CLIENT_SECRET') }}"
      database: "{{ env_var('OPTERYX_WORKSPACE', 'personal') }}"
      schema: "{{ env_var('OPTERYX_COLLECTION', env_var('CLIENT_ID')) }}"
      threads: 1
