name: integration (opteryx.app)

on: push

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: |
          python -m pip install -U pip
          pip install .

      - name: run dbt feature matrix
        env:
          CLIENT_ID: ${{ secrets.OPTERYX_TEST_CLIENT }}
          CLIENT_SECRET: ${{ secrets.OPTERYX_TEST_TOKEN }}
          OPTERYX_WORKSPACE: opteryx_ci
          OPTERYX_COLLECTION: dbt
        run: python tests/integration/run.py
