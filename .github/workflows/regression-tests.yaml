name: regression tests

on: push

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Floor from pyproject, and latest.
        dbt-core: ["~=1.10.0", ""]
        exclude:
          # dbt-core 1.10 pins mashumaro<3.15, which cannot import on Python 3.14.
          - python-version: "3.14"
            dbt-core: "~=1.10.0"

    name: py${{ matrix.python-version }} dbt-core${{ matrix.dbt-core || ' latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest -e . "dbt-core${{ matrix.dbt-core }}"
          python -c "from importlib.metadata import version; print('dbt-core', version('dbt-core'))"

      - name: run regression tests
        run: python -m pytest -q tests/unit
